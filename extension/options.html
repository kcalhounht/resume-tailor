<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Resume Tailor options</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 14px;
        background: #151b18;
        color: #e8eee9;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        color: #93a399;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 10px;
        padding: 8px;
        border: 1px solid #3a4840;
        background: #0d1210;
        color: #e8eee9;
      }
      button {
        border: 0;
        padding: 8px 10px;
        background: #3ecf8e;
        color: #04140c;
        font-weight: 700;
        cursor: pointer;
      }
      p {
        color: #93a399;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <label for="appUrl">Resume Tailor site</label>
    <input
      id="appUrl"
      type="url"
      placeholder="https://your-app.vercel.app"
    />
    <button id="save" type="button">Save</button>
    <p>
      Local default is http://localhost:3000. For Vercel, paste your live
      https://…vercel.app URL, save, then open the side panel.
    </p>
    <p id="saved" hidden>Saved.</p>
    <script src="options.js"></script>
  </body>
</html>
