<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Resume Tailor</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #151b18;
        color: #e8eee9;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 10px;
        border-bottom: 1px solid #2a3530;
        background: #0d1210;
      }
      button {
        border: 0;
        padding: 8px 10px;
        background: #3ecf8e;
        color: #04140c;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .tab-meta {
        flex: 1;
        min-width: 0;
        color: #93a399;
        font-size: 11px;
        line-height: 1.35;
      }
      .tab-meta strong {
        display: block;
        color: #e8eee9;
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      a {
        color: #3ecf8e;
        font-size: 12px;
        white-space: nowrap;
      }
      .error {
        margin: 0;
        padding: 8px 10px;
        color: #f07178;
        font-size: 12px;
        border-bottom: 1px solid #2a3530;
      }
      iframe {
        flex: 1;
        width: 100%;
        border: 0;
        background: #0d1210;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="capture" type="button">Use this tab</button>
      <div class="tab-meta">
        <strong id="tab-title">Current tab</strong>
        <span id="tab-url">Switch to a job posting, then capture it.</span>
      </div>
      <a id="options" href="#">Site</a>
    </div>
    <p id="status" class="error" hidden></p>
    <iframe id="app" title="Resume Tailor"></iframe>
    <script src="sidepanel.js"></script>
  </body>
</html>
